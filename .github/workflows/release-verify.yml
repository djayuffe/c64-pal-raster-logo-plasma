name: Verify published release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Install ACME
        run: |
          sudo apt-get update
          sudo apt-get install --yes acme
          acme --version

      - name: Rebuild and verify
        run: |
          make clean
          make
          shasum -a 256 -c SHA256SUMS.txt
          python3 -B -c 'import ast, pathlib; ast.parse(pathlib.Path("tools/capture_vice.py").read_text())'

      - name: Preserve verified release PRG
        uses: actions/upload-artifact@v4
        with:
          name: c64-pal-raster-logo-plasma-release-prg
          path: build/c64_pal_raster_logo_plasma.prg
          if-no-files-found: error
